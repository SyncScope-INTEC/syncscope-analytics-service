version: '3.8'

services:
  # Analytics Service
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DATABASE_URL=postgresql://analytics_user:analytics_pass@postgres:5432/analytics_db
      - REDIS_URL=redis://redis:6379/0
      - AUTH_SERVICE_URL=http://auth:8000
      - MONITORING_SERVICE_URL=http://monitoring:8000
      - MANAGEMENT_SERVICE_URL=http://management:8000
      - SECRET_KEY=dev-secret-key-change-in-production
    volumes:
      - .:/app
      - static_volume:/app/static
      - media_volume:/app/media
    depends_on:
      - postgres
      - redis
    networks:
      - syncscope-network
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=analytics_db
      - POSTGRES_USER=analytics_user
      - POSTGRES_PASSWORD=analytics_pass
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - syncscope-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics_user -d analytics_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - syncscope-network
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3


  # Nginx (optional - for production-like setup)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/static:ro
      - media_volume:/app/media:ro
    depends_on:
      - analytics
    networks:
      - syncscope-network
    restart: unless-stopped
    profiles:
      - production

  # Mock Auth Service (for testing)
  mock-auth:
    image: mockserver/mockserver:latest
    ports:
      - "8001:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    volumes:
      - ./mocks/auth-expectations.json:/config/expectations.json
    networks:
      - syncscope-network
    profiles:
      - testing

  # Mock Monitoring Service (for testing)
  mock-monitoring:
    image: mockserver/mockserver:latest
    ports:
      - "8002:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    volumes:
      - ./mocks/monitoring-expectations.json:/config/expectations.json
    networks:
      - syncscope-network
    profiles:
      - testing

  # Mock Management Service (for testing)
  mock-management:
    image: mockserver/mockserver:latest
    ports:
      - "8003:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    volumes:
      - ./mocks/management-expectations.json:/config/expectations.json
    networks:
      - syncscope-network
    profiles:
      - testing

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  syncscope-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16